dataset_name: bidmc
data_path: datasets/bidmc-ppg-and-respiration-dataset-1.0.0/bidmc_csv
evaluation_protocol: cross_dataset
test_dataset_name: capnobase
test_data_path: datasets/CapnoBase/data/csv

training:
  batch_size: 128
  epochs: 150
  lr: 0.007
  lr_patience: 8
  lr_scheduler: plateau
  weight_decay: 0.0001
  seed: 36
  num_workers: 4
  mode: train_and_test

data:
  window_size: 30
  window_shift: 2
  val_split: 0.2
  test_split: 0.2

models:
  tf_ig:
    in_channels: 1
    out_channels: 64
